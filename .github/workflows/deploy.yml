name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master # або main, залежно від вашої головної гілки

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 18

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Deploy Compiled Static to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
